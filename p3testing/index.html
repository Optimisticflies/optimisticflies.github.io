<style>



.side-rail {

    position: fixed;

    top: 0;

    width: 220px;

    height: 100vh;

    overflow: hidden;

    z-index: 0;

    pointer-events: none;
}

.left-rail {
    left: 0;
}

.right-rail {
    right: 0;
}



.rail-track {

    display: flex;

    flex-direction: column;

    animation: scrollDown 60s linear infinite;
}

.reverse {
    animation: scrollUp 60s linear infinite;
}



.rail-image {

    width: 200px;

    margin: 8px auto;

    display: block;

    image-rendering: pixelated;

    border: 2px solid #333;

    opacity: 0.9;
}



center,
table,
.scroll-left,
h1,
h6,
p,
iframe,
section {

    position: relative;

    z-index: 2;
}


@keyframes scrollDown {

    from {
        transform: translateY(-50%);
    }

    to {
        transform: translateY(0%);
    }
}

@keyframes scrollUp {

    from {
        transform: translateY(0%);
    }

    to {
        transform: translateY(-50%);
    }
}



@media (max-width: 1200px) {

    .side-rail {
        display: none;
    }
}

</style>

<script>



var total_images = 171;

var png_images = [
    1, 3, 4, 5, 6, 7, 8, 11,
    155, 156, 157, 158, 159, 160,
    161, 162, 163, 164, 165,
    166, 167, 168, 169, 170, 171
];

function getRandomImage() {

    var random_number =
        Math.floor(Math.random() * total_images) + 1;

    var extension =
        png_images.includes(random_number)
        ? "png"
        : "JPG";

    return "https://www.lamerzone.net/assets/photos/"
        + random_number
        + "."
        + extension;
}



function populateRail(id, amount) {

    var rail = document.getElementById(id);

    for (var i = 0; i < amount; i++) {

        var img = document.createElement("img");

        img.src = getRandomImage();

        img.className = "rail-image";

        rail.appendChild(img);
    }

    /* duplicate for seamless looping */

    rail.innerHTML += rail.innerHTML;
}


populateRail("left-track", 15);
populateRail("right-track", 15);

</script>
